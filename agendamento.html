<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento | AutoPlay</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            <h1>AutoPlay</h1>
            <p>Centro automotivo</p>
        </div>

        <nav>
            <a href="index.html">Início</a>
            <a href="servicos.html">Serviços</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="contato.html">Contato</a>
            <a href="agendamento.html">📅Agendar Serviços</a>
        </nav>
    </header>

    <main>

        <section class="servicos-topo">
            <h1>Agendamento</h1>
            <p>Agende um serviço para seu veículo</p>
        </section>

        <section class="agendamento">

            <div class="caixa-agendamento">

                <h2>Agendar Serviço</h2>

                <form>

                    <label>Nome</label>
                    <input type="text">

                    <label>Telefone</label>
                    <input type="text">

                    <label>Veículo</label>
                    <input type="text">

                    <label>Serviço</label>

                    <select>
                        <option>Mecânica Geral</option>
                        <option>Troca de Óleo</option>
                        <option>Freios</option>
                        <option>Suspensão</option>
                        <option>Diagnóstico</option>
                    </select>

                    <label>Data</label>
                    <input type="date">

                    <label>Observações</label>
                    <textarea></textarea>

                    <button>Agendar Serviço</button>

                </form>

            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 AutoPlay Centro Automotivo.</p>
    </footer>

</body>

</html>
